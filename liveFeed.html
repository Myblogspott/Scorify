<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Feed App with AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }
        .card {
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: #fff;
            text-align: center;
        }
        .btn {
            width: 100%;
            font-size: 1.2rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome to Scorify</h2>
        <p class="mt-3">Click <strong>Start</strong> to use AI features like question detection and response, or <strong>Record</strong> to capture and respond to spoken statements.</p>
        <button id="startButton" class="btn btn-success">Start Camera</button>
        <button id="recordButton" class="btn btn-primary"><i class='bi bi-mic'></i> Record</button>
        <button id="interactiveReadingButton" class="btn btn-secondary"><i class="bi bi-book"></i> Interactive Reading</button>
        <button id="interactiveListeningButton" class="btn btn-warning"><i class="bi bi-headphones"></i> Interactive Listening</button>
        <video id="videoFeed" autoplay style="display: none; margin-top: 20px;"></video>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const recordButton = document.getElementById('recordButton');
        const interactiveReadingButton = document.getElementById('interactiveReadingButton');
        const interactiveListeningButton = document.getElementById('interactiveListeningButton');
        const videoFeed = document.getElementById('videoFeed');
        let lastDetectedText = "";
        let recognition;

        interactiveReadingButton.addEventListener('click', () => {
            window.location.href = "interactive_reading.html"; // Replace with the correct path if necessary
        });

        interactiveListeningButton.addEventListener('click', () => {
            window.location.href = "interactive_listening.html"; // Replace with the
        });

        // Camera function
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoFeed.srcObject = stream;
                videoFeed.style.display = 'block';
            } catch (error) {
                alert('Unable to access the camera. Please check permissions.');
            }
        }

        // Process frame for text detection
        async function processFrame() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = videoFeed.videoWidth;
            canvas.height = videoFeed.videoHeight;
            const cropWidth = canvas.width * 0.8;
            const cropHeight = canvas.height * 0.8;
            const cropX = (canvas.width - cropWidth) / 2;
            const cropY = (canvas.height - cropHeight) / 2;

            context.drawImage(
                videoFeed,
                cropX, cropY, cropWidth, cropHeight,
                0, 0, canvas.width, canvas.height
            );

            const imageData = canvas.toDataURL('image/jpeg').split(",")[1];

            try {
                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=AIzaSyDaxpfOkQbVWG-RkeEH1thGgCaxitHvA3I`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        requests: [
                            {
                                image: { content: imageData },
                                features: [{ type: "TEXT_DETECTION" }]
                            }
                        ]
                    })
                });

                const result = await response.json();
                const textAnnotations = result.responses[0]?.textAnnotations;
                if (!textAnnotations || textAnnotations.length === 0) {
                    console.log("No text detected.");
                    return;
                }

                const detectedText = textAnnotations[0]?.description.trim();
                if (detectedText && detectedText !== lastDetectedText) {
                    console.log("Detected Text: ", detectedText);
                    lastDetectedText = detectedText;

                    // Map detected text to formats and prompts
                    let prompt;
                    if (detectedText.includes("Format 1")) {
                        prompt = `Please answer in format 1: ${detectedText}`;
                    } else if (detectedText.includes("Format 2")) {
                        prompt = `Respond according to format 2: ${detectedText}`;
                    } else if (detectedText.includes("Format 3")) {
                        prompt = `Provide output in format 3: ${detectedText}`;
                    } else if (detectedText.includes("Format 4")) {
                        prompt = `Answer as per format 4: ${detectedText}`;
                    } else if (detectedText.includes("Format 5")) {
                        prompt = `Elaborate using format 5: ${detectedText}`;
                    } else if (detectedText.includes("Format 6")) {
                        prompt = `Complete this according to format 6: ${detectedText}`;
                    } else if (detectedText.includes("Format 7")) {
                        prompt = `Structure this response as per format 7: ${detectedText}`;
                    } else if (detectedText.includes("Format 8")) {
                        prompt = `Process this in format 8: ${detectedText}`;
                    } else if (detectedText.includes("Format 9")) {
                        prompt = `Explain in format 9: ${detectedText}`;
                    } else if (detectedText.includes("Format 10")) {
                        prompt = `Answer following format 10: ${detectedText}`;
                    } else if (detectedText.includes("Format 11")) {
                        prompt = `Describe using format 11: ${detectedText}`;
                    } else if (detectedText.includes("Format 12")) {
                        prompt = `Output based on format 12: ${detectedText}`;
                    } else {
                        prompt = `Process this input: ${detectedText}`;
                    }

                    // Send prompt to GPT model
                    const answerResponse = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer 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'
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [
                                { role: 'user', content: `${prompt}\n\n###\n\n` }
                            ],
                            max_tokens: 100,
                            stop: ["."]
                        })
                    });

                    const answerData = await answerResponse.json();
                    const answer = answerData.choices[0]?.message?.content || "No answer found.";
                    console.log("Generated Answer: ", answer);

                    // Speak the GPT-generated response
                    const utterance = new SpeechSynthesisUtterance(answer);
                    utterance.lang = "en-IN";
                    utterance.onerror = (e) => console.error('Speech synthesis error:', e);
                    speechSynthesis.speak(utterance);
                }
            } catch (error) {
                console.error('Error processing frame or generating answer:', error);
            }
        }

        // Audio recording and transcription
        function startRecording() {
            try {
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = "en-US";
                recognition.interimResults = false;

                recognition.onresult = async (event) => {
                    const transcript = event.results[0][0].transcript;
                    console.log("Recorded Statement: ", transcript);

                    const answerResponse = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer 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'
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [
                                { role: 'user', content: `${transcript}\n\n###\n\n` }
                            ],
                            max_tokens: 50,
                            stop: ["."]
                        })
                    });

                    const answerData = await answerResponse.json();
                    const answer = answerData.choices[0]?.message?.content || "No response available.";
                    console.log("Recorded Statement: ", transcript);
                for (let i = 0; i < 3; i++) {    

                    const utterance = new SpeechSynthesisUtterance(transcript);
                    utterance.lang = "en-IN";
                    utterance.onerror = (e) => console.error('Speech synthesis error:', e);
                    speechSynthesis.speak(utterance);
                }
                };

                recognition.onerror = (e) => console.error("Speech recognition error: ", e);
                recognition.start();
            } catch (error) {
                console.error("Speech recognition not supported or failed: ", error);
            }
        }

        recordButton.addEventListener('click', () => {
            startRecording();
        });

        startButton.addEventListener('click', () => {
            startButton.style.display = 'none';
            startCamera();

            setInterval(() => {
                processFrame();
            }, 2000);
        });
    </script>
</body>
</html>
