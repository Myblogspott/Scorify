<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorify - Interactive Reading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }
        .card {
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: #fff;
            text-align: center;
        }
        .btn {
            width: 100%;
            font-size: 1.2rem;
            margin-top: 15px;
        }
        video {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Scorify - Interactive Reading</h2>
        <p class="mt-3">Click <strong>Upload Image</strong> or <strong>Start Camera</strong> to begin, and then <strong>Process</strong> to analyze the question.</p>
        <label for="uploadImageButton" class="btn btn-secondary mb-3">
    <i class="bi bi-upload"></i> Upload Image
</label>
<input type="file" id="uploadImageButton" accept="image/*" style="display: none;">
        <button id="startCameraButton" class="btn btn-success">Start Camera</button>
        <button id="processImageButton" class="btn btn-primary" disabled>Process</button>
        <video id="videoFeed" autoplay></video>
    </div>

    <script>
        const startCameraButton = document.getElementById("startCameraButton");
        const uploadImageButton = document.getElementById("uploadImageButton");
        const processImageButton = document.getElementById("processImageButton");
        const videoFeed = document.getElementById("videoFeed");
        let uploadedImageBase64 = "";

        // Start Camera Functionality
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoFeed.srcObject = stream;
                videoFeed.style.display = "block";
                processImageButton.disabled = false;
            } catch (error) {
                alert("Unable to access the camera. Please check permissions.");
            }
        }

        // Handle Image Upload
        uploadImageButton.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                uploadedImageBase64 = reader.result.split(",")[1];
                console.log("Image successfully uploaded.");
                processImageButton.disabled = false;
            };
            reader.onerror = (error) => {
                console.error("Error reading image file:", error);
                alert("Failed to read the image. Please try again.");
            };
            reader.readAsDataURL(file);
        });

        // Process Image Functionality
        async function processImage() {
            let imageData = "";
            if (uploadedImageBase64) {
                imageData = uploadedImageBase64;
            } else {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                // Ensure canvas dimensions match video feed dimensions
                canvas.width = videoFeed.videoWidth || 640;
                canvas.height = videoFeed.videoHeight || 480;

                // Crop and draw video frame onto the canvas
                const cropWidth = canvas.width * 0.8;
                const cropHeight = canvas.height * 0.8;
                const cropX = (canvas.width - cropWidth) / 2;
                const cropY = (canvas.height - cropHeight) / 2;

                context.drawImage(
                    videoFeed,
                    cropX, cropY, cropWidth, cropHeight,
                    0, 0, canvas.width, canvas.height
                );

                // Convert canvas to Base64
                imageData = canvas.toDataURL('image/jpeg').split(",")[1];
            }

            try {
                // Send the image to Google Vision API
                const visionResponse = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=AIzaSyDaxpfOkQbVWG-RkeEH1thGgCaxitHvA3I`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        requests: [
                            {
                                image: { content: imageData },
                                features: [{ type: "TEXT_DETECTION" }]
                            }
                        ]
                    })
                });

                if (!visionResponse.ok) {
                    throw new Error(`Google Vision API Error: ${visionResponse.statusText}`);
                }

                const visionResult = await visionResponse.json();
                console.log("Vision API Response:", visionResult);

                const questionText = visionResult.responses?.[0]?.fullTextAnnotation?.text?.trim();

                if (!questionText) {
                    throw new Error("No text detected by Google Vision API.");
                }

                console.log("Extracted Text:", questionText);

                // Send the extracted text to GPT-4 Fine-Tuned Model
                const prompt = `Analyze the input text and generate the correct answers only, strictly without any additional context or irrelevant text:\n\n${questionText}`;

                const gptResponse = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: "Bearer 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"
                    },
                    body: JSON.stringify({
                        model: "ft:gpt-4o-2024-08-06:personal:final1:AeIHmf2n",
                        messages: [{ role: "user", content: prompt }],
                        max_tokens: 300
                    })
                });

                if (!gptResponse.ok) {
                    throw new Error("GPT-4 API error");
                }

                const gptData = await gptResponse.json();
                const gptAnswer = gptData.choices?.[0]?.message?.content?.trim();

                if (!gptAnswer) {
                    throw new Error("No answer generated by GPT-4.");
                }

                console.log("Generated Answer:", gptAnswer);

                // Speak the answer
                const utterance = new SpeechSynthesisUtterance(gptAnswer);
                utterance.lang = "en-IN";
                utterance.onerror = (error) => console.error("Speech synthesis error:", error);
                utterance.onend = () => console.log("Speech synthesis completed.");
                speechSynthesis.speak(utterance);

            } catch (error) {
                console.error("Error during Interactive Reading process:", error);
            }
        }

        // Event Listener for Process Image Button
        processImageButton.addEventListener("click", processImage);

        // Event Listener for Start Camera Button
        startCameraButton.addEventListener("click", startCamera);
    </script>
</body>
</html>
